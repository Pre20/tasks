<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="stylereg.css">
</head>

<body>
    <h1>STUDENT REGISTRATION FORM</h1>
    <div id="one">
        <form>
             <label for="name">Name:</label>
             <input type="text" id="name" placeholder="Enter Name in Caps">
             
             <label for="Dept">Department:</label>
             <input type="text" id="Dept" placeholder="Enter Department">
            
             <label for="dob">Date Of Birth:</label>
             <input type="date" id="dob">
            
             <label>Select Course</label>
             <select id="course">
                <option disabled>Select</option>
                <option>BSc in Computer Science</option>
                <option>MSc in Computer Science</option>
                <option>Bcom General</option>
            </select>

            <button>Submit</button>
        </form>
    </div>
</body>
</html>
